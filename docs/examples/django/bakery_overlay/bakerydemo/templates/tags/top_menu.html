{% load navigation_tags wagtailcore_tags %}
{% get_site_root as site_root %}

{% for menuitem in menuitems %}
    <li class="presentation {{ menuitem.title|lower|cut:" " }}{% if menuitem.active %} active{% endif %}">
        <a href="{% pageurl menuitem %}">{{ menuitem.title }}</a>
    </li>
{% endfor %}

<li class="presentation{% if request.path == '/products/explore/' %} active{% endif %}">
    <a href="/products/explore/">Explore breads</a>
</li>

{% if request.user.is_staff %}
    <li class="presentation"><a href="/spa_admin/">SPA admin</a></li>
{% endif %}
