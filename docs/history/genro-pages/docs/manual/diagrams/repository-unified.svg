<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="795" viewBox="0 0 1100 795" role="img" aria-label="Proposed source organization — unified GUI repository"><rect width="1100" height="795" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#243447"><text x="30" y="42" font-size="26" font-weight="700">Proposed source organization — unified GUI repository</text><text x="30" y="72" font-size="16">PROPOSAL ONLY · No repository move or package rename has been implemented</text><rect x="20" y="98" width="1060" height="560" rx="14" fill="#edf3fa" stroke="#246395" stroke-width="2"/><text x="40" y="130" font-size="20" font-weight="700">Proposed repository: genro-gui</text><rect x="40" y="150" width="330" height="196" rx="10" fill="white" stroke="#246395" stroke-width="2"/><text x="58" y="181" font-size="20" font-weight="700" fill="#246395">packages/pages-python</text><text x="58" y="208" font-size="14" font-weight="600">PYTHON</text><text x="58" y="241" font-size="15">Page authoring and GUI recipes</text><text x="58" y="269" font-size="15">Initial document and startup</text><text x="58" y="297" font-size="15">Uses external genro-builders</text><text x="58" y="325" font-size="15">Generated wheel resources</text><rect x="385" y="150" width="330" height="196" rx="10" fill="white" stroke="#246395" stroke-width="2"/><text x="403" y="181" font-size="20" font-weight="700" fill="#246395">packages/pages-js</text><text x="403" y="208" font-size="14" font-weight="600">JAVASCRIPT</text><text x="403" y="241" font-size="15">Browser page bootstrap</text><text x="403" y="269" font-size="15">Page lifecycle integration</text><text x="403" y="297" font-size="15">Optional server transports</text><text x="403" y="325" font-size="15">Inspector and playground</text><rect x="730" y="150" width="330" height="196" rx="10" fill="white" stroke="#33795b" stroke-width="2"/><text x="748" y="181" font-size="20" font-weight="700" fill="#33795b">packages/dom-js</text><text x="748" y="208" font-size="14" font-weight="600">JAVASCRIPT</text><text x="748" y="241" font-size="15">SourceBag and reactive binding</text><text x="748" y="269" font-size="15">DOM rendering and updates</text><text x="748" y="297" font-size="15">Widgets, containers and forms</text><text x="748" y="325" font-size="15">Usable without Python</text><rect x="40" y="390" width="500" height="168" rx="10" fill="white" stroke="#8a6130" stroke-width="2"/><text x="58" y="421" font-size="20" font-weight="700" fill="#8a6130">adapters/</text><text x="58" y="448" font-size="14" font-weight="600">PYTHON · OPTIONAL HOST INTEGRATION</text><text x="58" y="481" font-size="15">asgi/ — common HTTP and static serving</text><text x="58" y="509" font-size="15">fastapi/ — framework integration</text><text x="58" y="537" font-size="15">genro-asgi/ — identity, workers and WSX</text><rect x="560" y="390" width="500" height="168" rx="10" fill="white" stroke="#65568e" stroke-width="2"/><text x="578" y="421" font-size="20" font-weight="700" fill="#65568e">Shared repository infrastructure</text><text x="578" y="448" font-size="14" font-weight="600">CONTRACTS · TESTS · DOCUMENTATION · BUILD</text><text x="578" y="481" font-size="15">contracts/ and tests/ — Python / JS compatibility</text><text x="578" y="509" font-size="15">docs/ and examples/ — manual and usage</text><text x="578" y="537" font-size="15">tools/ and assets/ — release assembly</text><text x="30" y="698" font-size="17" font-weight="700">Remain separate repositories</text><text x="30" y="730" font-size="16">genro-builders · genro-bag · genro-bag-js · genro-tytx · genro-asgi</text><text x="30" y="763" font-size="15">One source repository can produce separate Python and JavaScript distributions.</text></g></svg>