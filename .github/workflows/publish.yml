name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/gramlot/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the release tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag/version mismatch'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish verified distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: browser-distributions
          path: browser-dist
      - name: Publish release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *a*|*b*|*rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* browser-dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
          else
            gh release create "$RELEASE_TAG" dist/* browser-dist/* --title "$RELEASE_TAG" \
              --generate-notes --prerelease="$prerelease" --verify-tag
          fi
