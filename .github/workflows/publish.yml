name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gramlot/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the release tag to match the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag/version mismatch'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish verified distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
