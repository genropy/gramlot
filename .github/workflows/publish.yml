name: Publish GitHub prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag/version mismatch'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: browser-distributions
          path: browser-dist
      - name: Publish immutable pre-alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; artifacts are immutable.'
            exit 1
          fi
          sha256sum dist/* browser-dist/* > SHA256SUMS
          gh release create "$RELEASE_TAG" dist/* browser-dist/* SHA256SUMS \
            --title "Gramlot ${RELEASE_TAG#v} · pre-alpha" \
            --notes-file docs/release-notes-0.1.3.md --prerelease --verify-tag
