name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} and browser runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js/dom/package-lock.json
      - run: npm --prefix js/dom ci --ignore-scripts
      - run: python scripts/prepare_assets.py
      - run: python scripts/prepare_test_client.py
      - run: python -m pip install '.[test,fastapi]' httpx
      - run: python -m pytest -q
        env:
          GRAMLOT_CLIENT_MODULES: ${{ github.workspace }}/build/test-client
      - run: npm --prefix js/dom test

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js/dom/package-lock.json
      - run: npm --prefix js/dom ci --ignore-scripts
      - run: python scripts/prepare_assets.py
      - run: python -m pip install build twine
      # Default build produces an sdist, then builds the wheel from that sdist.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installation without optional server dependencies
        run: |
          python -m venv build/wheel-check
          build/wheel-check/bin/python -m pip install dist/*.whl
          build/wheel-check/bin/python -I scripts/verify_distribution.py
          build/wheel-check/bin/python -c "from importlib.util import find_spec; assert find_spec('fastapi') is None"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
